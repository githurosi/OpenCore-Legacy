name: 仓库文件检测与同步
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *" # UTC+8凌晨1点（如需UTC时区改为17点）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检测并处理版本号文件
        run: |
          if [! -f version.txt ]; then
            echo "版本号文件不存在，开始同步..."
            # 这里假设从目标仓库获取版本号的逻辑，你需根据实际情况替换
            TARGET_REPO="harry0703/MoneyPrinterTurbo"
            README_URL="https://raw.githubusercontent.com/${TARGET_REPO}/main/README.md"
            curl -s "$README_URL" > temp_readme.md
            TAG_NAME=$(grep -oP '(?<=v)\d+\.\d+\.\d+' temp_readme.md || echo "")
            echo "$TAG_NAME" > version.txt
            echo "版本号文件同步完成"
          else
            echo "版本号文件已存在，跳过同步"
          fi

      - name: 检测并处理日志文件夹
        run: |
          if [! -d logs ]; then
            echo "日志文件夹不存在，开始创建并同步..."
            mkdir logs
            # 这里假设从目标仓库获取日志内容并放入logs文件夹的逻辑，你需根据实际情况替换
            echo "日志文件夹创建并同步完成"
          else
            echo "日志文件夹已存在，跳过同步"
          fi

      - name: 检测并处理temp_readme.md文件
        run: |
          if [! -f temp_readme.md ]; then
            echo "temp_readme.md文件不存在，开始同步..."
            # 这里假设从目标仓库获取README内容并保存为temp_readme.md的逻辑，你需根据实际情况替换
            TARGET_REPO="harry0703/MoneyPrinterTurbo"
            README_URL="https://raw.githubusercontent.com/${TARGET_REPO}/main/README.md"
            curl -s "$README_URL" > temp_readme.md
            echo "temp_readme.md文件同步完成"
          else
            echo "temp_readme.md文件已存在，跳过同步"
          fi

      - name: 提交变更（如果有）
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 检测并同步仓库缺失文件
          files: |
            version.txt
            logs/*
            temp_readme.md
