name: 同步README日志（带顺序调整）
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *" # UTC+8凌晨1点（如需UTC时区改为17点）
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 获取目标仓库README内容
        id: fetch-readme
        run: |
          set -euo pipefail
          TARGET_REPO="harry0703/MoneyPrinterTurbo"
          README_URL="https://raw.githubusercontent.com/${TARGET_REPO}/main/README.md"
          curl -s "$README_URL" > temp_readme.md

      - name: 提取并重组日志内容
        run: |
          set -euo pipefail
          FORCE_UPDATE=${{ github.event.inputs.force_update || 'false' }}
          LOCAL_VERSION=$(cat version.txt 2>/dev/null || echo "")
          TARGET_TAG=$(grep -oP '(?<=MoneyPrinterTurbo )v\d+\.\d+\.\d+' temp_readme.md) # 提取目标版本号

          # 提取资产日志（假设资产日志标题为"资产与更新日志"，需根据实际调整）
          ASSET_LOG=$(awk '/## 📦 资产日志/,/## \[更新日志\]/{if (/## 📦 资产日志/) {p=1; next} if (/## \[更新日志\]/) {p=0} p}' temp_readme.md)
          # 提取更新日志（假设更新日志标题为"## 📅 更新日志"）
          UPDATE_LOG=$(awk '/## 📅 更新日志/,/^## /{if (/## 📅 更新日志/) {p=1; next} if (/^## / && NR>1) {p=0} p}' temp_readme.md)

          # 组合日志顺序：资产日志 -> 更新日志
          combined_log=$(echo -e "$ASSET_LOG\n$UPDATE_LOG")

          # 仅在版本变更或强制更新时写入
          if [ "$LOCAL_VERSION" != "$TARGET_TAG" ] || [ "$FORCE_UPDATE" = "true" ]; then
            echo "$TARGET_TAG" > version.txt
            # 清空现有README中的日志部分（以"## 📦 资产日志"为起始标记）
            sed -i '/## 📦 资产日志/,+1d' README.md
            echo -e "\n## 📦 资产日志\n$ASSET_LOG\n## 📅 更新日志\n$UPDATE_LOG" >> README.md
          else
            echo "✅ 日志已同步至最新版本（$TARGET_TAG）"
          fi

      - name: 提交变更
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 🔄 同步README日志（资产优先显示）
          files: |
            README.md
            version.txt
