name: 同步资产与更新日志（根目录版）
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 17 * * *" # 每天 UTC 17点运行（对应北京时间次日凌晨1点）
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write # 明确写入权限

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 浅克隆加速
          
      - name: 创建 README.md 文件
        run: |
          pwd
          ls -la
          if [! -f README.md ]; then
            echo "# OpenCore - 旧版项目简介" > README.md
            chmod 644 README.md
            git add README.md
          fi

      - name: 列出仓库文件
        run: |
          ls -la
          if [! -f README.md ]; then
            echo "❗ README.md 文件未找到"
          fi

      - name: 初始化版本文件
        run: |
          if [ ! -f version.txt ]; then
            echo "" > version.txt
          fi

      - name: 安装依赖（仅保留解析工具）
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq wget

      - name: 获取最新版本信息
        id: get-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_OWNER="dortania"
          REPO_NAME="OpenCore-Legacy-Patcher"
          response=$(curl -s https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          TAG_NAME=$(echo "$response" | jq -r '.tag_name')
          # 使用 @text 转义为纯文本，避免 Markdown 格式冲突
          RELEASE_NOTES=$(echo "$response" | jq -r '@text')
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "RELEASE_NOTES=$RELEASE_NOTES" >> $GITHUB_OUTPUT

      - name: 同步更新日志与版本
        run: |
          set -euo pipefail
          # 标准化参数为小写，避免布尔值判断错误
          FORCE_UPDATE=$(echo "${{ github.event.inputs.force_update || 'false' }}" | tr '[:upper:]' '[:lower:]')
          LOCAL_VERSION=$(cat version.txt 2>/dev/null || echo "")
          TAG_NAME=${{ steps.get-release.outputs.TAG_NAME }}
          RELEASE_NOTES=${{ steps.get-release.outputs.RELEASE_NOTES }}

          # 版本检查或强制更新判断
          if [ "$LOCAL_VERSION" = "$TAG_NAME" ] && [ "$FORCE_UPDATE" != "true" ]; then
            echo "✅ 已是最新版本（$TAG_NAME），无需更新"
            exit 0
          fi

          # 写入新版本号
          echo "$TAG_NAME" > version.txt

          # 清空原有更新日志（以标题为标记）
          if [ -f README.md ]; then
            sed -i '/^## 📅 更新日志/,+1d' README.md
          else
            echo "❗ README.md 文件未找到，无法清空原有日志"
          fi

          # 追加新日志（使用换行符转义）
          if [ -f README.md ]; then
            echo -e "## 📅 更新日志\n### $TAG_NAME\n$RELEASE_NOTES" >> README.md
          else
            echo "❗ README.md 文件未找到，无法追加新日志"
          fi

      - name: 提交更改
        if: always() # 确保无论成功失败都尝试提交（可选）
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 🔄 同步 ${{ steps.get-release.outputs.TAG_NAME }} 版本日志
          file_pattern: |
            version.txt
            README.md
