name: 同步资产与更新日志（根目录版）
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点运行（UTC+8）
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 浅克隆加速

      - name: 安装依赖（仅保留解析工具）
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq wget

      - name: 获取最新版本信息
        id: get-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_OWNER="dortania"
          REPO_NAME="OpenCore-Legacy-Patcher"
          response=$(curl -s https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          TAG_NAME=$(echo "$response" | jq -r '.tag_name')
          RELEASE_NOTES=$(echo "$response" | jq -r '.body')
          # 对日志内容进行全面转义处理
          RELEASE_NOTES=$(echo "$RELEASE_NOTES" | sed 's/[&/\]/\\&\\/\\]/g; s/"/\\"/g; s/\'/\\\'/g; s/\n/\\n/g')
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "RELEASE_NOTES=$RELEASE_NOTES" >> $GITHUB_OUTPUT

      - name: 同步更新日志与版本
        run: |
          set -euo pipefail
          FORCE_UPDATE=${{ github.event.inputs.force_update || 'false' }}
          LOCAL_VERSION=$(cat version.txt 2>/dev/null || echo "")
          TAG_NAME=${{ steps.get-release.outputs.TAG_NAME }}
          RELEASE_NOTES=${{ steps.get-release.outputs.RELEASE_NOTES }}
          if [ "$LOCAL_VERSION" = "$TAG_NAME" ] && [ "$FORCE_UPDATE" != "true" ]; then
            echo "✅ 已是最新版本（$TAG_NAME），无需更新"
            exit 0
          fi
          echo "$TAG_NAME" > version.txt
          echo -e "## 📅 更新日志\n### $TAG_NAME\n$RELEASE_NOTES" >> README.md

      - name: 提交更改
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 🔄 同步 ${TAG_NAME} 版本日志
          file_pattern: |
            version.txt
            README.md
