name: 同步仓库资产与日志
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *" # UTC+8 凌晨1点（需确认GitHub时区为UTC时调整为17点）
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整克隆以获取所有历史记录和文件

      - name: 安装依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget jq unzip # 按需添加其他工具

      - name: 获取最新版本信息
        id: get-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_OWNER="dortania"
          REPO_NAME="OpenCore-Legacy-Patcher"
          response=$(curl -s https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest)
          TAG_NAME=$(echo "$response" | jq -r '.tag_name')
          RELEASE_NOTES=$(echo "$response" | jq -r '.body')
          ASSETS=($(echo "$response" | jq -r '.assets[].name')) # 获取资产列表

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "RELEASE_NOTES=$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "ASSETS=$(printf "%s\n" "${ASSETS[@]}")" >> $GITHUB_OUTPUT # 存储资产列表

      - name: 同步更新日志（基于CHANGELOG.md或README.md）
        run: |
          set -euo pipefail
          FORCE_UPDATE=${{ github.event.inputs.force_update || 'false' }}
          LOCAL_VERSION=$(cat version.txt 2>/dev/null || echo "")
          TAG_NAME=${{ steps.get-release.outputs.TAG_NAME }}
          RELEASE_NOTES=${{ steps.get-release.outputs.RELEASE_NOTES }}

          # 版本检查：仅在版本变更或强制更新时执行
          if [ "$LOCAL_VERSION" = "$TAG_NAME" ] && [ "$FORCE_UPDATE" != "true" ]; then
            echo "✅ 已是最新版本（$TAG_NAME），无需更新"
            exit 0
          fi

          # 更新版本文件
          echo "$TAG_NAME" > version.txt

          # 同步日志到CHANGELOG.md（若仓库使用CHANGELOG）
          if [ -f CHANGELOG.md ]; then
            echo -e "\n## $TAG_NAME\n$RELEASE_NOTES" >> CHANGELOG.md
          else
            # 若使用README.md，取消注释以下行
            # echo -e "\n## 📅 更新日志\n### $TAG_NAME\n$RELEASE_NOTES" >> README.md
          fi

      - name: 下载资产（可选）
        if: steps.get-release.outputs.ASSETS != ""
        run: |
          set -euo pipefail
          ASSETS=(${!!{ steps.get-release.outputs.ASSETS }}) # 解析资产列表
          REPO_OWNER="dortania"
          REPO_NAME="OpenCore-Legacy-Patcher"

          mkdir -p assets # 创建资产存储目录
          for asset in "${ASSETS[@]}"; do
            DOWNLOAD_URL=$(curl -s https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest | jq -r ".assets[] | select(.name == \"$asset\") | .browser_download_url")
            wget -q --show-progress "$DOWNLOAD_URL" -O "assets/$asset"
            echo "已下载资产: $asset"
          done

      - name: 提交变更
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            🔄 同步 ${TAG_NAME} 版本
            日志更新: ${{ steps.get-release.outputs.RELEASE_NOTES | truncate:50 }}
          files: |
            version.txt
            CHANGELOG.md # 或README.md
            assets/*       # 若启用资产下载
